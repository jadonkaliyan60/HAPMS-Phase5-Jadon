<div class="login-container">
  <div class="login-card">
    <div class="login-form-section">
      <div class="form-header">
        <h2>Create an Account</h2>
        <p>A few details to make your care more personal.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="register()" class="auth-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="input-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <input type="text" id="fullName" formControlName="fullName" placeholder="Name and Surname" />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="input-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <input type="email" id="email" formControlName="email" placeholder="name@hapms.demo" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="input-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input type="password" id="password" formControlName="password" placeholder="••••••••" />
          </div>
        </div>

        @if (errorMessage()) {
          <div class="alert alert-error">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
            </svg>
            {{ errorMessage() }}
          </div>
        }

        <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner"></span> Creating Account...
          } @else {
            Register
          }
        </button>
      </form>
      
      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login" class="text-link font-semibold">Sign In</a></p>
      </div>
    </div>

    <div class="login-brand" style="border-radius: 0 1.5rem 1.5rem 0;">
      <div class="brand-content">
        <div class="logo">
          
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
            <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12.75 6a.75.75 0 00-1.5 0v6c0 .29.115.568.32.77l4.5 4.5a.75.75 0 001.06-1.06l-4.13-4.13V6z" clip-rule="evenodd" />
          </svg>
          <h2>HAPMS</h2>
        </div>
        <h1>Your health.<br>Your schedule.</h1>
        <p>Register as a patient today.</p>
      </div>
    </div>
  </div>
</div>
